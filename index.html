lo que transporta personas?`)},{id:`clothing`,text:f(`Giysi mi (tişört, pantolon, ceket…)?`,`Is it clothing (shirt, pants, jacket…)?`,`Ist es ein Kleidungsstück?`,`¿Es una prenda de ropa?`)},{id:`footwear`,text:f(`Ayağa giyilen bir şey mi (ayakkabı, terlik, çorap…)?`,`Is it worn on the feet (shoe, slipper, sock…)?`,`Trägt man es an den Füßen?`,`¿Se lleva en los pies?`)},{id:`furniture`,text:f(`Mobilya mı (masa, sandalye, yatak, dolap…)?`,`Is it furniture (table, chair, bed, wardrobe…)?`,`Ist es ein Möbelstück?`,`¿Es un mueble?`)},{id:`appliance`,text:f(`Büyük bir ev aleti mi (buzdolabı, çamaşır makinesi, fırın…)?`,`Is it a large home appliance (fridge, washer, oven…)?`,`Ist es ein großes Haushaltsgerät?`,`¿Es un electrodoméstico grande?`)},{id:`toy`,text:f(`Asıl amacı oyuncak / oyun olmak mı?`,`Is its main purpose to be a toy or for play?`,`Ist sein Hauptzweck Spielzeug?`,`¿Su propósito principal es ser un juguete?`)},{id:`building`,text:f(`Binanın bir parçası mı (kapı, pencere, duvar, merdiven…)?`,`Is it part of a building (door, window, wall, stairs…)?`,`Ist es Teil eines Gebäudes?`,`¿Es parte de un edificio?`)},{id:`kitchen`,text:f(`Çoğu evde mutfakta mı bulunur / kullanılır?`,`Would you usually find or use it in a home kitchen?`,`Findet/benutzt man es meist in der Küche?`,`¿Se usa o encuentra normalmente en la cocina?`)},{id:`bathroom`,text:f(`Çoğunlukla banyoda mı kullanılır?`,`Is it mostly used in the bathroom?`,`Benutzt man es vor allem im Bad?`,`¿Se usa sobre todo en el baño?`)},{id:`bedroom`,text:f(`Daha çok yatak odasında mı kullanılır?`,`Is it mainly used in a bedroom?`,`Benutzt man es vor allem im Schlafzimmer?`,`¿Se usa sobre todo en el dormitorio?`)},{id:`desk`,text:f(`Masa başında, ofiste veya okulda mı kullanılır?`,`Is it used at a desk, office, or school?`,`Benutzt man es am Schreibtisch, Büro oder Schule?`,`¿Se usa en escritorio, oficina o escuela?`)},{id:`school`,text:f(`Okul çantasında veya sınıfta sıkça görülür mü?`,`Do you often see it in a classroom or school bag?`,`Sieht man es oft in der Schule oder im Schulranzen?`,`¿Se ve mucho en clase o en la mochila?`)},{id:`outdoors`,text:f(`Daha çok açık havada mı kullanılır?`,`Is it mainly used outdoors?`,`Benutzt man es vor allem draußen?`,`¿Se usa sobre todo al aire libre?`)},{id:`natural`,text:f(`Doğada kendi başına bulunur mu (fabrika ürünü değil)?`,`Does it exist in nature by itself (not man-made)?`,`Kommt es in der Natur von allein vor?`,`¿Existe solo en la naturaleza (no fabricado)?`)},{id:`tiny`,text:f(`Bir bozuk paradan belirgin şekilde küçük mü?`,`Is it clearly smaller than a coin?`,`Ist es deutlich kleiner als eine Münze?`,`¿Es claramente más pequeño que una moneda?`)},{id:`pocket`,text:f(`Rahatça cebine sığar mı?`,`Can it fit comfortably in a pocket?`,`Passt es bequem in eine Hosentasche?`,`¿Cabe cómodamente en un bolsillo?`)},{id:`handheld`,text:f(`Tek elle rahat tutulur mu?`,`Can you comfortably hold it in one hand?`,`Kann man es bequem in einer Hand halten?`,`¿Se puede sujetar cómodamente con una mano?`)},{id:`bigger_book`,text:f(`Kalın bir kitaptan belirgin şekilde büyük mü?`,`Is it clearly larger than a thick book?`,`Ist es deutlich größer als ein dickes Buch?`,`¿Es claramente más grande que un libro grueso?`)},{id:`heavy`,text:f(`Bir yetişkin için taşıması genelde zor / ağır mı?`,`Is it usually heavy or hard for an adult to carry?`,`Ist es für Erwachsene meist schwer zu tragen?`,`¿Suele ser pesado o difícil de llevar para un adulto?`)},{id:`wearable`,text:f(`Vücuda giyilir veya takılır mı?`,`Do people wear it on the body?`,`Trägt man es am Körper?`,`¿Se lleva en el cuerpo?`)},{id:`jewelry`,text:f(`Takı mı (yüzük, kolye, küpe, bilezik…)?`,`Is it jewelry (ring, necklace, earring…)?`,`Ist es Schmuck?`,`¿Es una joya o bisutería?`)},{id:`worn_on_head`,text:f(`Başa giyilir veya takılır mı (şapka, bere, kask…)?`,`Is it worn on the head (hat, beanie, helmet…)?`,`Trägt man es am Kopf (Hut, Mütze, Helm…)?`,`¿Se lleva en la cabeza (sombrero, gorro, casco…)?`)},{id:`worn_on_neck`,text:f(`Boyuna veya boyna takılır / sarılır mı (atkı, kolye, kravat…)?`,`Is it worn around the neck (scarf, necklace, tie…)?`,`Trägt man es um den Hals (Schal, Kette, Krawatte…)?`,`¿Se lleva alrededor del cuello (bufanda, collar, corbata…)?`)},{id:`worn_on_wrist`,text:f(`Bileğe takılır mı (bilezik, kol saati…)?`,`Is it worn on the wrist (bracelet, watch…)?`,`Trägt man es am Handgelenk (Armband, Uhr…)?`,`¿Se lleva en la muñeca (pulsera, reloj…)?`)},{id:`worn_on_hands`,text:f(`Ellere giyilir mi (eldiven…)?`,`Is it worn on the hands (gloves…)?`,`Trägt man es an den Händen (Handschuhe…)?`,`¿Se lleva en las manos (guantes…)?`)},{id:`metal`,text:f(`Çoğunlukla metalden mi yapılmış?`,`Is it mostly made of metal?`,`Besteht es hauptsächlich aus Metall?`,`¿Está hecho principalmente de metal?`)},{id:`wood`,text:f(`Çoğunlukla ahşaptan mı yapılmış?`,`Is it mostly made of wood?`,`Besteht es hauptsächlich aus Holz?`,`¿Está hecho principalmente de madera?`)},{id:`plastic`,text:f(`Çoğunlukla plastikten mi yapılmış?`,`Is it mostly made of plastic?`,`Besteht es hauptsächlich aus Kunststoff?`,`¿Está hecho principalmente de plástico?`)},{id:`glass_mat`,text:f(`Çoğunlukla camdan mı yapılmış?`,`Is it mostly made of glass?`,`Besteht es hauptsächlich aus Glas?`,`¿Está hecho principalmente de vidrio?`)},{id:`paperish`,text:f(`Kâğıt veya karton bir şey mi?`,`Is it made of paper or cardboard?`,`Besteht es aus Papier oder Karton?`,`¿Está hecho de papel o cartón?`)},{id:`fabric`,text:f(`Çoğunlukla kumaştan mı yapılmış?`,`Is it mostly made of fabric / cloth?`,`Besteht es hauptsächlich aus Stoff?`,`¿Está hecho principalmente de tela?`)},{id:`soft`,text:f(`Dokununca yumuşak mı (kumaş, sünger, peluş…)?`,`Is it soft to the touch (fabric, foam, plush…)?`,`Ist es weich (Stoff, Schaum, Plüsch…)?`,`¿Es blando al tacto?`)},{id:`round`,text:f(`Genel şekli top gibi yuvarlak mı?`,`Is its overall shape round like a ball?`,`Ist die Form rund wie ein Ball?`,`¿Su forma es redonda como una pelota?`)},{id:`cylindrical`,text:f(`Silindir / tüp şeklinde mi (kalem, şişe, rulo gibi)?`,`Is it cylindrical / tube-shaped (pen, bottle, roll…)?`,`Ist es zylindrisch / röhrenförmig (Stift, Flasche, Rolle…)?`,`¿Es cilíndrico / en forma de tubo (bolígrafo, botella, rollo…)?`)},{id:`flat`,text:f(`Yassı / ince düz bir şekli mi var (kart, kâğıt, kapak…)?`,`Is it flat and thin (card, paper, lid…)?`,`Ist es flach und dünn?`,`¿Es plano y fino?`)},{id:`transparent`,text:f(`Saydam / içinden ışık geçer mi?`,`Is it transparent / see-through?`,`Ist es durchsichtig?`,`¿Es transparente?`)},{id:`fragile`,text:f(`Düşürülünce kolay kırılır mı?`,`Does it break easily if dropped?`,`Zerbricht es leicht, wenn es fällt?`,`¿Se rompe fácilmente si se cae?`)},{id:`tool`,text:f(`El aleti mi (çekiç, tornavida, makas…)?`,`Is it a hand tool (hammer, screwdriver, scissors…)?`,`Ist es ein Handwerkzeug?`,`¿Es una herramienta de mano?`)},{id:`container`,text:f(`İçine bir şey koymak için mi tasarlandı?`,`Was it designed to hold things inside?`,`Ist es zum Hineinlegen gemacht?`,`¿Está diseñado para meter cosas dentro?`)},{id:`bag`,text:f(`Çanta, torba veya poşet mi?`,`Is it a bag, tote, or plastic shopping bag?`,`Ist es eine Tasche oder Tüte?`,`¿Es un bolso, bolsa o bolsa de plástico?`)},{id:`cutting`,text:f(`Kesmek veya doğramak için mi kullanılır?`,`Is it used for cutting or slicing?`,`Benutzt man es zum Schneiden?`,`¿Se usa para cortar?`)},{id:`writing`,text:f(`Yazmak veya çizmek için mi kullanılır?`,`Is it used for writing or drawing?`,`Benutzt man es zum Schreiben oder Zeichnen?`,`¿Se usa para escribir o dibujar?`)},{id:`reading`,text:f(`Okumak için mi (kitap, gazete, dergi…)?`,`Is it mainly for reading (book, newspaper…)?`,`Dient es vor allem zum Lesen?`,`¿Sirve sobre todo para leer?`)},{id:`screen`,text:f(`Görüntü gösteren bir ekranı var mı?`,`Does it have a display screen?`,`Hat es einen Bildschirm?`,`¿Tiene una pantalla?`)},{id:`electricity`,text:f(`Çalışması için dışarıdan elektrik mi ist
