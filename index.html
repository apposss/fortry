 sonido a propósito al usarse (música, pitido, motor…)?`)},{id:`music`,text:f(`Müzik aleti mi?`,`Is it a musical instrument?`,`Ist es ein Musikinstrument?`,`¿Es un instrumento musical?`)},{id:`sport`,text:f(`Spor yaparken mi kullanılır?`,`Is it used when playing sports?`,`Benutzt man es beim Sport?`,`¿Se usa al practicar deporte?`)},{id:`hot`,text:f(`Kullanırken ısınır veya sıcak mı tutulur?`,`Does it get hot or stay hot when used?`,`Wird es bei Gebrauch heiß / bleibt es heiß?`,`¿Se calienta o está caliente al usarlo?`)},{id:`water`,text:f(`Suyla birlikte mi kullanılır (yıkama, yüzme, sulama…)?`,`Is it used together with water (washing, swimming, watering…)?`,`Benutzt man es mit Wasser (Waschen, Schwimmen, Gießen…)?`,`¿Se usa junto con agua (lavar, nadar, regar…)?`)},{id:`food_related`,text:f(`Yemek hazırlamak veya yemek yemek için mi kullanılır (tabak, tencere, çatal…)?`,`Is it used to prepare or eat food (plate, pot, fork…)?`,`Dient es zum Kochen oder Essen (Teller, Topf, Gabel…)?`,`¿Se usa para cocinar o comer (plato, olla, tenedor…)?`)},{id:`for_kids`,text:f(`Daha çok çocuklara mı yönelik?`,`Is it mainly meant for children?`,`Ist es vor allem für Kinder gedacht?`,`¿Está pensado sobre todo para niños?`)},{id:`expensive`,text:f(`Yeni alındığında genelde pahalı mı (ortalama bir kişi için)?`,`Is it usually expensive when new (for an average person)?`,`Ist es neu gekauft meist teuer (für Normalverdiener)?`,`¿Suele ser caro cuando es nuevo (para una persona media)?`)},{id:`daily`,text:f(`Çoğu insan bunu neredeyse her gün kullanır mı?`,`Do most people use this almost every day?`,`Benutzen die meisten Menschen das fast täglich?`,`¿La mayoría de la gente lo usa casi todos los días?`)}],m=(e,t,n,r)=>({tr:e,en:t,de:n,es:r});function h(e,t,n){return{id:e,name:t,attrs:n}}function g(e){let t={};for(let n of p)t[n.id]=e[n.id]??.5;return t}var _=[h(`phone`,m(`Cep telefonu`,`Mobile phone`,`Handy`,`Teléfono móvil`),g({electronic:1,screen:1,electricity:1,pocket:1,daily:1,sound:.8,
